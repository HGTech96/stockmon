[tool.poetry]
name = "stockmon"
version = "0.1.0"
description = "Personal stock buy/sell decision helper"
authors = []
packages = [{ include = "stockmon", from = "src" }]

[tool.poetry.scripts]
stockmon = "stockmon.main:main"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
sqlalchemy = "^2.0"
alembic = "^1.13"
psycopg = { extras = ["binary"], version = "^3.2" }
pydantic-settings = "^2.6"
yfinance = "^0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
httpx = "^0.27"
python-dotenv = "^1.2.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
